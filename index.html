    :root {
      --netflix-red: #e50914;
      --netflix-red-hover: #f40612;
      --pink-accent: #ff4d8d;
      --gold-accent: #ffd166;
      --bg-dark: #141414;
      --bg-card: #181818;
      --bg-modal: #181818;
      --text-main: #ffffff;
      --text-muted: #b3b3b3;
      --match-green: #46d369;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Be Vietnam Pro', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0f0f0f;
    }
    ::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--netflix-red);
    }

    /* ==========================================
       1. PROFILE GATE ("WHO'S WATCHING?")
       ========================================== */
    #profile-gate {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #1f1418 0%, #0b0b0b 100%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s ease, visibility 0.6s ease;
      padding: 20px;
      text-align: center;
    }

    #profile-gate.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .gate-logo {
      position: absolute;
      top: 28px;
      left: 48px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.6rem;
      letter-spacing: 3px;
      color: var(--netflix-red);
      text-shadow: 0 2px 12px rgba(229, 9, 20, 0.5);
    }

    .gate-title {
      font-size: clamp(1.8rem, 4vw, 3.2rem);
      font-weight: 600;
      margin-bottom: 40px;
      color: #fff;
      letter-spacing: -0.5px;
    }
